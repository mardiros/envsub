[package]
name = "envsub"
version = "1.0.0"
authors = ["Guillaume Gauvrit <guillaume@gauvr.it>"]
edition = "2024"
description = "A text preprocessing tool with environment variable substitution and default value support."
license = "MIT"
license-file = "LICENSE"
readme = "README.md"

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311", "extension-module"] }

[lib]
name = "envsub"
crate-type = ["staticlib"]
path = "src/rust/lib.rs"

[package.metadata.maturin]
bindings = "pyo3"

[tool.maturin]
features = ["pyo3/extension-module"]
